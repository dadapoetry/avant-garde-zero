<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVANT-GARDE ZERO</title>
    <meta name="description" content="Point zero of the new international avant-garde.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial, sans-serif' font-size='22' font-weight='900' fill='%23E1FF00'%3E%C3%98%3C/text%3E%3C/svg%3E">
    <style>

        :root {
            --bg: #E1FF00;          
            --text: #000000;        
            --accent: #FF0000;      

            --font-brutal: 'Arial Black', Impact, sans-serif;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            padding: 8vh 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; 
            text-align: center;
            position: relative;
            overflow-x: hidden;
        }

        .header-zero {
            width: 100%;
            margin-bottom: 8vh;
        }

        .main-title {
            font-family: var(--font-brutal);
            font-size: clamp(3rem, 11vw, 9rem); 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 0.8;
            color: var(--text);
            margin-bottom: 15px;
        }

        .contact-email {
            font-family: var(--font-mono);
            font-size: clamp(14px, 2vw, 16px);
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            background-color: var(--text);
            color: var(--bg);
            padding: 4px 12px;
            transition: all 0.15s ease;
        }

        .contact-email:hover {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .showcase-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            margin: auto 0;
        }

        .nav-arrow {
            font-family: var(--font-brutal);
            font-size: clamp(3rem, 8vw, 6rem);
            cursor: pointer;
            user-select: none;
            transition: color 0.1s;
        }

        .nav-arrow:hover { color: var(--accent); }

        .showcase-zero {
            width: 100%;
            max-width: 800px;
        }

        .rotator-box {
            opacity: 0;
            transition: opacity 0.05s steps(1); /* Pure mechanical cut */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            text-align: left;
        }

        .image-container {
            flex-shrink: 0;
            width: clamp(140px, 20vw, 220px);
            aspect-ratio: 1 / 1; 
            background-color: var(--bg); 
        }

        .article-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(220%) brightness(90%); 
            mix-blend-mode: multiply; 
        }

        .content-block {
            max-width: 500px;
        }

        .display-title {
            font-family: var(--font-brutal);
            font-size: clamp(2.2rem, 4vw, 3.5rem);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -0.04em;
            margin-bottom: 20px;
            color: var(--text);
        }

        .display-subtitle {
            font-family: var(--font-mono);
            font-size: clamp(1rem, 1.8vw, 1.15rem);
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 25px;
            font-weight: 600;
        }

        .display-author {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .read-link {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2px;
            letter-spacing: 0.05em;
        }

        .read-link:hover {
            color: var(--bg);
            background-color: var(--accent);
        }

        .side-footer {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            writing-mode: vertical-rl;
            z-index: 90;
            white-space: nowrap;
          
        }

        .side-footer a {
            color: var(--text);
            border-left: 2px solid var(--text);
            text-decoration: none;
            padding: 5px 0;
        }

        .side-footer a:hover {
            color: var(--bg);
            background-color: var(--text);
        }

        .loading {
            filter: blur(10px);
            opacity: 0.6;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        .loaded {
            filter: blur(0px);
            opacity: 1;
            transition: filter 0.5s ease, opacity 0.5s ease;
        }

        .article-img {
            transition: filter 0.5s ease;
        }

   
        .log-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            z-index: 1000;
            display: none; /* Controlled via JS */
            flex-direction: column;
            padding: 8vh 60px;
            overflow-y: auto;
            text-align: left;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--text);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .log-main-title {
            font-family: var(--font-brutal);
            text-transform: uppercase;
            font-size: clamp(2rem, 5vw, 4rem);
            line-height: 0.9;
        }

        .log-close-btn {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--text);
            color: var(--bg);
            padding: 6px 14px;
            text-transform: uppercase;
        }

        .log-close-btn:hover {
            background-color: var(--accent);
            color: #FFFFFF;
        }

        .log-list {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px dashed var(--text);
            gap: 30px;
        }

        .log-item-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-item-title {
            font-family: var(--font-brutal);
            text-transform: uppercase;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1;
        }

        .log-item-author {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 700;
            opacity: 0.8;
        }

        .log-download-trigger {
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: bold;
            color: var(--accent);
            text-decoration: none;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 2px;
            cursor: pointer;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .log-download-trigger:hover {
            color: var(--bg);
            background-color: var(--accent);
        }


        @media (max-width: 768px) {
            body {
                padding: 30px 20px;
                justify-content: flex-start;
                min-height: auto;
            }

            .header-zero { margin-bottom: 35px; }
            .showcase-wrapper { position: relative; gap: 0; }
            
            .rotator-box {
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            .image-container { width: 140px; }
            .display-title { font-size: 2.4rem; margin-bottom: 15px; line-height: 0.95; }
            .display-subtitle { margin-bottom: 20px; line-height: 1.4; }
            .main-title { font-size: 4rem; line-height: 0.9; letter-spacing: -0.02em; }

            .side-footer {
                position: static;
                transform: none;
                writing-mode: horizontal-tb;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 50px;
                gap: 8px;
                font-size: 12px;
            }

            .side-footer a {
                border-left: none;
                border-bottom: 2px solid var(--text);
                padding-bottom: 2px;
            }

            .log-overlay { padding: 30px 20px; }
            .log-item { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>
<body>

    <header class="header-zero">
        <h1 class="main-title">avant-garde zero</h1>
        <a href="mailto:avantgardezero@proton.me" class="contact-email">avantgardezero@proton.me</a>
    </header>

    <div class="showcase-wrapper">
         <div id="btn-prev" class="nav-arrow">&lt;</div>

        <main class="showcase-zero">
            <div id="rotator" class="rotator-box">

                <div class="image-container">
                    <img id="r-img" src="" alt="position imagery" class="article-img">
                </div>

                <div class="content-block">
                    <h2 id="r-title" class="display-title">...</h2>
                    <h4 id="r-author" class="display-author">...</h4>
                    <p id="r-subtitle" class="display-subtitle">...</p>
                    <a href="#" id="r-link" class="read-link">read full .txt ↗</a>
                </div>

            </div>
        </main>

        <div id="btn-next" class="nav-arrow">&gt;</div>
    </div>
<div class="side-footer">
    <span><b>ISSN: [PENDING]</b> // CATALONIA // CONTINUOUS PUBLICATION </span>
    <a href="#" id="log-link">LOG OF ENTRIES ↗</a>
</div>

    <div id="log-overlay" class="log-overlay">
        <div class="log-header">
            <h2 class="log-main-title">ALL_ENTRIES.log</h2>
            <div id="log-close" class="log-close-btn">[CLOSE_LOG]</div>
        </div>
        <div id="log-content-list" class="log-list">
            </div>
    </div>

<script>

const SHEET_URL =
  "https://opensheet.elk.sh/1fj2YvMnsdVfSBKdRlMhfABB3ccIjah7Z1iFAAgGoxug/Articles";

let allPositions = []; 
let positions = [];    
let index = 0;
let timer;

const box = document.getElementById('rotator');
const img = document.getElementById('r-img');
const title = document.getElementById('r-title');
const subtitle = document.getElementById('r-subtitle');
const author = document.getElementById('r-author');
const link = document.getElementById('r-link');


const logLink = document.getElementById('log-link');
const logOverlay = document.getElementById('log-overlay');
const logClose = document.getElementById('log-close');
const logContentList = document.getElementById('log-content-list');

box.classList.add("loading");
title.textContent = "LOADING...";
author.textContent = "By who?";
subtitle.textContent = "syncing archive...";

function setLoaded() {
    box.classList.remove("loading");
    box.classList.add("loaded");
}

function setLoading() {
    box.classList.remove("loaded");
    box.classList.add("loading");
}

function loadData(idx) {
    if (!positions.length) return;

    setLoading();

    setTimeout(() => {
        const item = positions[idx];
        title.textContent = item.title || "";
        author.textContent = item.author ? `BY: ${item.author}` : "";
        subtitle.textContent = item.subtitle || "";

        if (item.image) {
            img.src = item.image;
            img.style.display = "block";
        } else {
            img.style.display = "none";
        }

        setLoaded();
    }, 80);
}

function nextArticle() {
    if (!positions.length) return;
    index = (index + 1) % positions.length;
    loadData(index);
}

function prevArticle() {
    if (!positions.length) return;
    index = (index - 1 + positions.length) % positions.length;
    loadData(index);
}

function startAutoPlay() {
    clearInterval(timer);
    timer = setInterval(() => {
        if (positions.length > 1) nextArticle();
    }, 6000);
}

document.getElementById('btn-next').addEventListener('click', () => {
    nextArticle();
    startAutoPlay();
});

document.getElementById('btn-prev').addEventListener('click', () => {
    prevArticle();
    startAutoPlay();
});

function generateTextFile(article) {
    let textContent = 
`-------------------------------------------------

AVANT-GARDE ZERO
Point zero of the new international avant-garde
ISSN: [PENDING]
https://ag0.surge.sh

-------------------------------------------------

${article.title || ""}
BY: ${article.author || ""}

${article.subtitle || ""}

--------------------------------------------------

${article.content || ""}

~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~

Rights of the article: ${article.author || ""}
      
~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~`;


    const linkRegex = /(?:\[([^\]]+)\]\((https?:\/\/[^\s)]+)\))|(https?:\/\/[^\s]+)/g;
    
    textContent = textContent.replace(linkRegex, function(match, text, markdownUrl, rawUrl) {
        if (rawUrl) {
            
            return `<a href="${rawUrl}" target="_blank" style="color: #FF0000; text-decoration: underline; font-weight: bold;">${rawUrl}</a>`;
        } else {
           
            return `<a href="${markdownUrl}" target="_blank" style="color: #FF0000; text-decoration: underline; font-weight: bold;">${text}</a>`;
        }
    });

 
    const htmlWrapper = `
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>${article.title || "TXT_VIEW"}</title>
        <meta name="description" content="${article.subtitle || "TXT_VIEW"}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial, sans-serif' font-size='22' font-weight='900' fill='%23E1FF00'%3E%C3%98%3C/text%3E%3C/svg%3E">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body {
                background-color: #ffffff;
                color: #000000;
                font-family: 'Courier New', Courier, monospace;
                font-size: 14px;
                line-height: 1.5;
                padding: 20px;
                margin: 0;
                white-space: pre-wrap;
                word-wrap: break-word;
            }
            @media (prefers-color-scheme: dark) {
                body { background-color: #1c1c1c; color: #e0e0e0; }
            }
        </style>
    </head>
    <body>${textContent}</body>
    </html>`;

    const blob = new Blob([htmlWrapper], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank");
}
link.addEventListener('click', (e) => {
    e.preventDefault();
    if (!positions.length) return;
    generateTextFile(positions[index]);
});

logLink.addEventListener('click', (e) => {
    e.preventDefault();
    logOverlay.style.display = "flex";
});

logClose.addEventListener('click', () => {
    logOverlay.style.display = "none";
});


function buildArchiveLog() {
    logContentList.innerHTML = "";
    
    allPositions.forEach((article) => {
        const item = document.createElement('div');
        item.className = 'log-item';
        
        item.innerHTML = `
            <div class="log-item-info">
                <span class="log-item-title">${article.title || "UNTITLED"}</span>
                <span class="log-item-author">${article.author ? `BY: ${article.author}` : "ANONYMOUS"}</span>
            </div>
            <span class="log-download-trigger">READ FULL .txt ↗</span>
        `;
        
   
        item.querySelector('.log-download-trigger').addEventListener('click', () => {
            generateTextFile(article);
        });
        
        logContentList.appendChild(item);
    });
}

fetch(SHEET_URL)
    .then(res => res.json())
    .then(data => {
        // Cache operational parameters across global dataset
        allPositions = data.sort((a, b) => Number(b.id) - Number(a.id));
        positions = allPositions.slice(0, 5);

        if (!positions.length) {
            title.textContent = "NO ENTRIES";
            subtitle.textContent = "No articles available.";
            setLoaded();
            return;
        }

        index = 0;

        title.textContent = positions[0].title;
        author.textContent = positions[0].author ? `BY: ${positions[0].author}` : "";
        subtitle.textContent = positions[0].subtitle;

        if (positions[0].image) {
            img.src = positions[0].image;
        }

        setLoaded();
        startAutoPlay();
        

        buildArchiveLog();

const urlParams = new URLSearchParams(window.location.search);
        const entryId = urlParams.get('entry');
        
        if (entryId) {

            const targetArticle = allPositions.find(p => String(p.id) === String(entryId));
            if (targetArticle) {

                generateTextFile(targetArticle);
            }
        }
    })
    .catch(err => {
        console.error(err);
        title.textContent = "CONNECTION ERROR";
        author.textContent = "I see no god over here";
        subtitle.textContent = "Unable to load entries.";
        setLoaded();
    });

</script>
</body>
</html>
